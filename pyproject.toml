[tool.poetry]
name = "tesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "~3.13"
# Core Django
django = ">=5.2.7"

# Database - PostgreSQL
psycopg2-binary = ">=2.9.9"

# Redis & Caching
redis = ">=5.0.1"
django-redis = ">=5.4.0"

# Async Task Queue - Celery
celery = {extras = ["redis"], version = ">=5.3.4"}

# Cloud Storage (S3-compatible: AWS, MinIO, etc.)
django-storages = ">=1.14.2"
boto3 = ">=1.34.0"

# Testing - BDD
behave-django = ">=1.7.0"

# Frontend - Tailwind CSS
django-tailwind = ">=3.8.0"
django-browser-reload = ">=1.12.1"

# Environment Variables Management
python-decouple = ">=3.8"

# Utilities
pillow = ">=10.1.0"
python-dateutil = ">=2.8.2"
faker = "^37.12.0"
dj-database-url = "^3.0.1"
spacy = "^3.8.9"
google-generativeai = "^0.8.5"
markdown = ">=3.5"

# Web Scraping
requests = ">=2.31.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=5.0.0"

# PDF Generation
reportlab = ">=4.0.0"
playwright = ">=1.40.0"
python-dotenv = ">=1.0.0"
tenacity = ">=8.2.3"
dotenv = "^0.9.9"
django-stubs = "^5.2.8"

[tool.poetry.group.dev.dependencies]
# Development dependencies for linting and type checking
mypy = "*"
pylint = "*"
flake8 = "*"
flake8-docstrings = "*"
flake8-bugbear = "*"
django-stubs = "^5.2.7"
django-stubs-ext = "^5.2.7"
hypothesis = "^6.148.3"
[tool.behave]
junit = true
junit_directory = "tests"
paths = [
    "tests/design/",
    "tests/interpretation/",
    "tests/extraction/",
    "tests/selection/",
    "tests/acquisition/",
]

[tool.pylint.MASTER]
ignore-paths = '^tests/.*$'
ignore-patterns = 'tests/.*$'

[tool.pylint.main]
# Use the same environment as the project
init-hook = 'import sys; sys.path.append(".")'
ignore-paths = ["^tests/.*$"]

[tool.pylint.messages_control]
# Disable specific warnings for behave decorators
extension-pkg-whitelist = ["behave"]

[[tool.mypy.overrides]]
module = ["google.genai.*"]
follow_untyped_imports = true

[[tool.pyright.overrides]]
module = ["google.genai.*"]
follow_untyped_imports = true