[mypy]
# Relaxed initial settings for easier adoption across the project
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
show_error_codes = True
pretty = True

# Do not force full strictness by default; you can tighten this later per-module
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Set python version to match project pyproject if desired
python_version = 3.13
