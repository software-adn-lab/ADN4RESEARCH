version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "false"
    container_name: adn4research_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      AWS_S3_ENDPOINT_URL: http://minio:9000
      USE_S3: "false"
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - adn4research_network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: adn4research_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-adn4research}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adn4research_network

  minio:
    image: minio/minio
    container_name: adn4research_minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    command: server --console-address ":9001" /data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - adn4research_network

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " echo 'Esperando a MinIO...'; sleep 5; /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-password}; /usr/bin/mc mb myminio/${AWS_STORAGE_BUCKET_NAME:-adn4research} --ignore-existing; /usr/bin/mc anonymous set public myminio/${AWS_STORAGE_BUCKET_NAME:-adn4research}; echo 'Bucket creado y permisos configurados'; exit 0; "
    networks:
      - adn4research_network
  redis:
    image: redis:7-alpine
    container_name: adn4research_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adn4research_network
volumes:
  postgres_data:
  minio_data:
  static_volume:
  media_volume:


networks:
  adn4research_network:
    driver: bridge
