<!-- ui/extraction/templates/partials/pdf_workspace/tag_list.html -->
<div class="p-4 border-b border-gray-200 bg-gray-50" id="tag-list-section">
    <h2 class="font-bold text-gray-800 text-sm mb-3">{{ paper.study.title|truncatechars:50 }}</h2>

    <div class="collapse collapse-arrow border border-base-300 bg-base-100 rounded-box">
        <input type="checkbox" checked />
        <div class="collapse-title text-xs font-bold uppercase text-gray-500 py-3 min-h-0">
            Etiquetas Obligatorias
        </div>
        <div class="collapse-content px-3 pb-3">
            <div class="flex flex-wrap gap-2" id="mandatory-tags-container">
                {% for tag in mandatory_tags %}
                    <div class="badge badge-sm gap-1 tag-badge" 
                         data-tag-id="{{ tag.id }}"
                         data-is-covered="{% if tag in paper.get_used_tags %}true{% else %}false{% endif %}">
                        {% if tag in paper.get_used_tags %}
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-3 h-3 stroke-current text-success">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                        {% endif %}
                        {{ tag.name }}
                    </div>
                {% empty %}
                    <span class="text-xs text-gray-400 italic">No hay etiquetas obligatorias.</span>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
