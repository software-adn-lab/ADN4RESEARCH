<!-- ✅ Agregar overflow-y-auto y flex-1 para que ocupe el espacio restante -->
<div class="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50" id="quotes-list-container">
    {% for quote in quotes %}
    <div class="card bg-white border hover:shadow-md transition group quote-card"
         data-quote-id="{{ quote.id }}"
         data-page="{{ quote.location.page|default:1 }}">
        
        <div class="card-body p-3">
            <!-- Header -->
            <div class="flex justify-between items-start mb-2">
                <span class="badge badge-ghost badge-xs">Pg. {{ quote.location.page|default:"?" }}</span>
                
                <!-- Botón Eliminar -->
                <button type="button" 
                        class="btn btn-ghost btn-xs text-error opacity-0 group-hover:opacity-100 transition-opacity delete-quote-btn"
                        onclick="event.stopPropagation(); deleteQuote({{ quote.id }})"
                        title="Eliminar quote">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
            
            <!-- Texto (clickable para scroll) -->
            <p class="text-xs text-gray-600 line-clamp-3 italic cursor-pointer hover:text-gray-900 border-l-2 border-gray-300 pl-2 hover:border-primary transition-colors"
               onclick="scrollToQuote({{ quote.id }}, {{ quote.location.page|default:1 }})">
                "{{ quote.text_fragment }}"
            </p>
            
            <!-- Tags -->
            <div class="flex flex-wrap gap-1 mt-2">
                {% for tag in quote.tags.all %}
                <span class="badge badge-xs" 
                      style="background-color: {{ tag.color }}70">
                    {{ tag.name }}
                </span>
                {% endfor %}
            </div>
        </div>
    </div>
    {% empty %}
    <div class="text-center text-gray-400 py-8" id="empty-quotes-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mx-auto mb-2 opacity-50">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
        </svg>
        <p class="text-sm font-medium">Sin extracciones</p>
        <p class="text-xs">Selecciona texto para comenzar</p>
    </div>
    {% endfor %}
</div>
