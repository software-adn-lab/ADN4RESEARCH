<div class="flex-1 overflow-y-auto p-3 space-y-3 bg-gray-50/50 custom-scroll" id="quotes-list-container">
    
    {% for quote in quotes %}
    <div class="group relative bg-white rounded-xl border border-gray-200 shadow-sm hover:shadow-md hover:border-primary transition-all duration-200 ease-out quote-card cursor-pointer"
         data-quote-id="{{ quote.id }}"
         data-page="{{ quote.location.page|default:1 }}"
         onclick="scrollToQuote({{ quote.id }}, {{ quote.location.page|default:1 }})">
        
        <div class="p-4">
            <div class="flex justify-between items-start mb-2">
                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono font-medium bg-gray-100 text-gray-500 border border-gray-200">
                    Pg. {{ quote.location.page|default:"-" }}
                </span>
                
                <button type="button" 
                        class="btn btn-xs btn-square btn-ghost text-gray-400 hover:text-red-500 hover:bg-red-50 opacity-0 group-hover:opacity-100 transition-all duration-200 delete-quote-btn"
                        onclick="event.stopPropagation(); deleteQuote({{ quote.id }})"
                        title="Delete Quote">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
            
            <blockquote class="relative border-l-2 border-gray-300 pl-3 py-0.5 mb-3 group-hover:border-primary transition-colors">
                <p class="text-sm text-gray-800 leading-relaxed font-serif italic line-clamp-4">
                    "{{ quote.text_fragment }}"
                </p>
            </blockquote>
            
            <div class="flex flex-wrap gap-1.5">
                {% for tag in quote.tags.all %}
                <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold border border-transparent" 
                      style="background-color: {{ tag.color }}15; color: {{ tag.color }};">
                    {{ tag.name }}
                </span>
                {% endfor %}
            </div>
        </div>
    </div>

    {% empty %}
    <div class="flex flex-col items-center justify-center h-64 text-center p-6 border-2 border-dashed border-gray-200 rounded-xl mt-4" id="empty-quotes-state">
        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mb-3 text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
            </svg>
        </div>
        <h3 class="text-sm font-semibold text-gray-900">No Extractions Yet</h3>
        <p class="text-xs text-gray-500 mt-1 max-w-[150px]">
            Select text in the PDF and choose a tag to create your first quote.
        </p>
    </div>
    {% endfor %}
</div>
