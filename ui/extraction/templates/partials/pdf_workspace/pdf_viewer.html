<div class="w-full bg-gray-200 relative h-full" id="pdf-section">
    <div id="pdf-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-50">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <span class="mt-4 font-bold text-gray-500 animate-pulse">Loading...</span>
    </div>

    <!-- Zoom Controls -->
    <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40 flex items-center gap-2 bg-white rounded-full shadow-lg px-4 py-2 border border-gray-200">
        <button type="button" 
                id="zoom-out-btn" 
                class="btn btn-sm btn-ghost text-gray-600 hover:bg-gray-100 rounded-full"
                title="Zoom out">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="w-4 h-4">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
        
        <span id="zoom-level" class="text-xs font-semibold text-gray-700 w-12 text-center">100%</span>
        
        <button type="button" 
                id="zoom-in-btn" 
                class="btn btn-sm btn-ghost text-gray-600 hover:bg-gray-100 rounded-full"
                title="Zoom in">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="w-4 h-4">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
                <line x1="8" y1="11" x2="14" y2="11"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
            </svg>
        </button>
        
        <div class="w-px h-6 bg-gray-200"></div>
        
        <button type="button" 
                id="zoom-reset-btn" 
                class="btn btn-sm btn-ghost text-gray-600 hover:bg-gray-100 rounded-full text-xs"
                title="Reset zoom">
            Reset
        </button>
    </div>

    <div id="pdf-viewer-container"></div>
</div>
