<!-- partials/pdf_workspace/quote_modal.html -->
<dialog id="quote_modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4">Nueva Extracción</h3>
        
        <form id="quote-form" method="post">
            {% csrf_token %}
            
            <!-- ✅ ID debe ser "selected-text" -->
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Texto Seleccionado</span>
                </label>
                <textarea id="selected-text" 
                          class="textarea textarea-bordered" 
                          rows="4" 
                          readonly></textarea>
                <label class="label">
                    <!-- ✅ ID debe ser "page-info" -->
                    <span id="page-info" class="label-text-alt text-gray-500"></span>
                </label>
            </div>

            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Etiquetas</span>
                </label>
                
                <div class="border rounded p-2 max-h-48 overflow-y-auto">
                    {% for tag in available_tags %}
                    <label class="flex items-center gap-2 p-2 hover:bg-base-200 cursor-pointer">
                        <input type="checkbox" 
                               name="tags" 
                               value="{{ tag.id }}"
                               class="checkbox checkbox-sm checkbox-primary">
                        <span class="text-sm">{{ tag.name }}</span>
                        <span class="badge badge-xs ml-auto" 
                              style="background-color: {{ tag.color }}"></span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="modal-action">
                <button type="button" class="btn" onclick="quote_modal.close()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</dialog>
