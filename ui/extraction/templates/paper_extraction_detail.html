<!-- ui/extraction/templates/paper_extraction_detail.html -->
{% extends 'base.html' %}
{% load static %}


{% block content %}
<div class="flex flex-col lg:flex-row h-[calc(100vh-64px)] overflow-hidden">

    <!-- PDF Viewer (Izquierda) -->
    {% include 'partials/pdf_workspace/pdf_viewer.html' %}

    <!-- Sidebar (Derecha) -->
    <div class="w-full lg:w-3/12 bg-white border-l border-gray-200 flex flex-col h-full shadow-2xl z-40">
        
        <!-- Tag List (Etiquetas Obligatorias) -->
        {% include 'partials/pdf_workspace/tag_list.html' %}
        
        <!-- Quote List (Extracciones) -->
        {% include 'partials/pdf_workspace/quote_list.html' %}
    </div>
</div>

<!-- Quote Modal -->
{% include 'partials/pdf_workspace/quote_modal.html' %}

<!-- Datos JSON para JavaScript -->
<script id="quotes-data" type="application/json">
{{ quotes_list_json|safe }}
</script>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    console.log('🔵 Defining WORKSPACE_CONFIG...');
    
    window.WORKSPACE_CONFIG = {
        pdfUrl: "{% url 'extraction:serve_pdf' paper.id %}",
        apiUrl: "{% url 'extraction:quote_create' %}",
        deleteApiUrl: "{% url 'extraction:quote_delete' 0 %}".replace('/0/', '/'),
        csrfToken: "{{ csrf_token }}",
        paperId: {{ paper.id }},
        existingQuotes: {{ quotes_list_json|safe }}
    };
    
    console.log('✅ Config ready');
    console.log('Delete API URL:', window.WORKSPACE_CONFIG.deleteApiUrl);
    console.log('📊 Existing quotes:', window.WORKSPACE_CONFIG.existingQuotes);
    console.log('📊 Quotes count:', window.WORKSPACE_CONFIG.existingQuotes.length);
    
    if (window.WORKSPACE_CONFIG.existingQuotes.length > 0) {
        console.log('📊 First quote:', window.WORKSPACE_CONFIG.existingQuotes[0]);
    }
</script>

<script src="{% static 'scripts/components/tag_manager.js' %}"></script>
<script src="{% static 'scripts/components/quote_manager.js' %}"></script>
<script src="{% static 'scripts/components/pdf_viewer.js' %}"></script>

<!-- 4️⃣ Orquestador principal (DESPUÉS de los componentes) -->
<script src="{% static 'scripts/paper_workspace.js' %}"></script>

{% endblock %}
