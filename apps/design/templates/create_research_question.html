{% extends 'base_tabs.html'%}
{% load static tailwind_tags %}
{% block tab_content %}
<form id="question-form" action="" class="form p-6 space-y-6">
    {% csrf_token %}
    <input type="hidden" id="research-question-id" name="id" value="{{ question.id|default:'' }}">
    <select id="framework-select" name="research_framework" class="select ">
        <option disabled {% if not question %}selected{% endif %}>Pick a framework</option>
        {% for framework in frameworks %}
            <option value="{{ framework.id }}" {% if framework.id == question.research_framework.id %}selected{% endif %}>
                {{ framework.name }}
            </option>
        {% endfor %}
    </select>
    <hr class="my-4">
    <div id="fields-container" class="space-y-4">
    </div>
    <div class="flex items-center mt-4 h-6"> {# h-6 para evitar que el layout salte #}
        <div id="autosave-status"></div>
    </div>

</form>
<script>
    // ⚙️ NUEVA SECCIÓN: Pasar datos de Django a JavaScript
    const QUESTION_DATA = {{ question_json|safe|default:"null" }};
    
    document.addEventListener('DOMContentLoaded', function() {
        const frameworkSelect = document.getElementById('framework-select');
        const fieldsContainer = document.getElementById('fields-container');
        const form = document.getElementById('question-form');
        const questionIdInput = document.getElementById('research-question-id');
        const autosaveStatus = document.getElementById('autosave-status');
        let lastSavedData = '';
        let saveStatusTimeout;

        // ...existing code (debounce, triggerAutosave)...
        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        function triggerAutosave() {
            const formData = new FormData(form);
            const currentDataString = new URLSearchParams(formData).toString();
            if (currentDataString === lastSavedData) {
                return;
            }
            clearTimeout(saveStatusTimeout);
            autosaveStatus.innerHTML = `
                <div class="flex items-center text-gray-500">
                    <svg class="mr-2 size-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Saving...
                </div>
            `;

            const autosaveUrl = "{% url 'design:autosave_research_question' %}";

            fetch(autosaveUrl, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.id) {
                    autosaveStatus.innerHTML = `
                        <div class="flex items-center text-green-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="mr-2 size-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                            </svg>
                            Saved
                        </div>
                    `;
                    saveStatusTimeout = setTimeout(() => {
                        autosaveStatus.innerHTML = '';
                    }, 1500);
                    questionIdInput.value = data.id;
                    lastSavedData = currentDataString;
                } else {
                    console.error('Autosave failed:', data.error);
                    autosaveStatus.innerHTML = `<span class="text-red-500">Autosave failed.</span>`;
                }
            })
            .catch(error => console.error('Autosave request failed:', error));
        }

        const debouncedAutosave = debounce(triggerAutosave, 3000);
        fieldsContainer.addEventListener('input', debouncedAutosave);

        // 🔧 FUNCIÓN MEJORADA: Cargar campos dinámicos y rellenarlos si hay datos
        function loadFrameworkFields(frameworkId) {
            const url = `/design/framework-fields/${frameworkId}/`;

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    fieldsContainer.innerHTML = '';

                    // 1. Renderizar campos específicos del framework
                    if (data.fields && data.fields.length > 0) {
                        data.fields.forEach(fieldName => {
                            const fieldset = document.createElement('fieldset');
                            fieldset.className = 'form-control w-full max-w-xs';
                            
                            // ✅ CLAVE: Obtener valor guardado si existe
                            const savedValue = QUESTION_DATA?.framework_fields?.[fieldName] || '';
                            
                            fieldset.innerHTML = `
                                <label class="label">
                                    <span class="label-text">${fieldName}</span>
                                </label>
                                <input type="text" 
                                       name="framework_fields[${fieldName}]" 
                                       value="${savedValue}"
                                       placeholder="Type here" 
                                       class="input input-bordered w-full max-w-xs" />
                            `;
                            fieldsContainer.appendChild(fieldset);
                        });
                    }

                    // 2. Añadir campos estáticos (suggested_question, motivation)
                    const suggestedValue = QUESTION_DATA?.suggested_question || '';
                    const motivationValue = QUESTION_DATA?.motivation || '';

                    const staticFieldsHTML = `
                        <div>
                            <label for="suggested_question" class="block mb-2 text-sm font-medium text-gray-900">Suggested Question</label>
                            <textarea id="suggested_question" name="suggested_question" rows="4" 
                                      class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300"
                                      placeholder="Write your question here...">${suggestedValue}</textarea>
                        </div>
                        <div>
                            <label for="motivation" class="block mb-2 text-sm font-medium text-gray-900">Motivation</label>
                            <textarea id="motivation" name="motivation" rows="4" 
                                      class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300"
                                      placeholder="Write the motivation...">${motivationValue}</textarea>
                        </div>
                        <div>
                            <button type="submit" class="btn btn-primary mt-4">Submit Question</button>
                        </div>
                    `;
                    fieldsContainer.insertAdjacentHTML('beforeend', staticFieldsHTML);
                })
                .catch(error => {
                    console.error('Error fetching framework fields:', error);
                    fieldsContainer.innerHTML = '<p class="text-red-500">Error loading fields.</p>';
                });
        }

        // ✅ Evento para cambio manual de framework
        frameworkSelect.addEventListener('change', function() {
            const frameworkId = this.value;
            if (!frameworkId) {
                fieldsContainer.innerHTML = '';
                return;
            }
            loadFrameworkFields(frameworkId);
        });

        // ✅ NUEVO: Auto-cargar campos si estamos editando
        if (QUESTION_DATA && QUESTION_DATA.research_framework_id) {
            loadFrameworkFields(QUESTION_DATA.research_framework_id);
        }
    });
</script>
{% endblock tab_content %}
